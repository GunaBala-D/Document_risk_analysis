name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    name: Unit, ML, API & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dre
          POSTGRES_PASSWORD: dre-ci-only
          POSTGRES_DB: dre_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dre -d dre_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dre:dre-ci-only@localhost:5432/dre_test
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + ML tests
        run: pytest tests/unit tests/ml -q
      - name: API + integration tests (SQLite and PostgreSQL)
        run: pytest tests/api tests/integration -q
      - name: Migrations match the ORM models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python -c "from sqlalchemy import create_engine, text; e=create_engine('${{ env.TEST_DATABASE_URL }}'); c=e.connect(); c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          alembic upgrade head
          alembic check

  frontend:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker build validation (no push)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: compose-config-check
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build -t document-risk-engine-backend:ci .
      - name: Smoke-test backend image
        run: docker run --rm document-risk-engine-backend:ci python -c "import api.main, lightgbm, shap, mlflow, pytesseract; print('imports ok')"
      - name: Build dashboard image
        run: docker build -t document-risk-engine-dashboard:ci ./frontend
